[package]
name = "rlevo-hybrid"
version.workspace = true
authors.workspace = true
description = "Hybrid evolutionary + RL strategies for rlevo (internal crate — use `rlevo` for the full API)"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
burn = { workspace = true }
rlevo-core = { path = "../rlevo-core", version = "0.5.0" }
rlevo-evolution = { path = "../rlevo-evolution", version = "0.5.0" }
rand = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
# Backend for this crate's tests and doctests only; the library itself
# names no backend (ADR 0080). `default` keeps Burn's own backend defaults
# (Flex with `simd` and `rayon`), which the facade cannot enable one by one.
burn = { workspace = true, features = ["default", "flex"] }
# CartPole for the policy-neuroevolution integration smoke test. Dev-only:
# `PolicyNeuroevolution` is generic over `E: Environment`, so the production
# crate carries no environment dependency.
rlevo-environments = { path = "../rlevo-environments", version = "0.5.0" }

[lints]
workspace = true
