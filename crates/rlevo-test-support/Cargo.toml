[package]
name = "rlevo-test-support"
version.workspace = true
authors.workspace = true
description = "Internal shared fixtures and helpers for rlevo integration tests (not published)"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The fixtures here name `Flex` and `Autodiff` in library code, which is why
# this crate, unlike the published ones, selects a backend (ADR 0080).
burn = { workspace = true, features = ["default", "flex", "autodiff"] }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
# Backing for the `capture` module, which lets integration tests assert on the
# `tracing` events a training loop emits (issue #321). Dev-only reach: this
# crate is `publish = false` and consumed solely through `[dev-dependencies]`.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rlevo-core = { path = "../rlevo-core", version = "0.5.0" }
rlevo-environments = { path = "../rlevo-environments", version = "0.5.0", default-features = false }

[lints]
workspace = true
