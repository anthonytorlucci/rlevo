[package]
name = "rlevo-reinforcement-learning"
version.workspace = true
authors.workspace = true
description = "Deep reinforcement learning algorithms for rlevo (internal crate — use `rlevo` for the full API)"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
burn = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rlevo-core = { path = "../rlevo-core", version = "0.4.0" }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
# `box2d` is on for the dev cone only: `benches/obs_guard_bench.rs` (issue
# #1043) measures the observation-finiteness guard against the two shapes the
# issue names -- `LunarLanderObservation` (8 floats) and `CarRacingObservation`
# (96x96x3) -- and both live behind that feature. No production dependency of
# this crate changes.
rlevo-environments = { path = "../rlevo-environments", version = "0.4.0", default-features = false, features = [
    "box2d",
] }

# Render LaTeX in docs (e.g. the cartpole physics) via KaTeX on docs.rs.
# The header must live inside this crate's own directory — docs.rs builds
# from the packaged tarball, which cannot contain files outside the crate
# root, so a `../../` path here silently works locally but 404s on docs.rs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "katex-header.html"]


