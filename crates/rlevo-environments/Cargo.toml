[package]
name = 'rlevo-environments'
version.workspace = true
authors.workspace = true
description = "RL benchmark environments and landscapes for rlevo (internal crate — use `rlevo` for the full API)"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
burn = { workspace = true }
rlevo-scene = { path = "../rlevo-scene", version = "0.4.0" }
rlevo-core = { path = '../rlevo-core', version = "0.4.0" }
rand = { workspace = true }
serde = { workspace = true }
rand_distr = { workspace = true }
thiserror = { workspace = true }
rapier2d = { workspace = true, optional = true }
rapier3d = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
bincode = { workspace = true }

# Render LaTeX in docs (e.g. the cartpole physics) via KaTeX on docs.rs.
# The header must live inside this crate's own directory — docs.rs builds
# from the packaged tarball, which cannot contain files outside the crate
# root, so a `../../` path here silently works locally but 404s on docs.rs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "katex-header.html"]

[features]
default = ["box2d", "locomotion"]
# Box2D-style physics environments (rapier2d)
box2d = ["dep:rapier2d"]
# MuJoCo-style locomotion environments (rapier3d)
locomotion = ["dep:rapier3d"]

# There is deliberately no `bench` / `record` feature here, and no dependency
# on `rlevo-benchmarks`. The harness consumes environments; environments do not
# consume the harness. The preset `Suite` factories and the `RecordedEnvFamily`
# impls that used to live in `src/bench/` now live in
# `rlevo-benchmarks::fixtures`, behind that crate's `fixtures` feature — the
# orphan rule allows it, because `rlevo-benchmarks` owns both traits (ADR 0080).
# Cargo enforces most of this on its own: `rlevo-benchmarks` names this crate as
# a normal (optional) dependency, and cargo's cycle detection counts optional
# normal deps, so re-adding the reverse edge fails at resolution.
# `tests/no_harness_dependency.rs` covers the gap — a dev-dependency, which
# forms no cycle.

[lints]
workspace = true
