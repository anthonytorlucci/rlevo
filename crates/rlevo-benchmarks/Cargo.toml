[package]
name = "rlevo-benchmarks"
version.workspace = true
authors.workspace = true
description = "Benchmarking harness for rlevo (internal crate — use `rlevo` for the full API)"
license.workspace = true
edition.workspace = true
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[dependencies]
rlevo-scene = { path = "../rlevo-scene", version = "0.4.0" }
rlevo-core = { path = "../rlevo-core", version = "0.4.0" }
# Shared single-source-of-truth metric registry (ADR-0015). Tiny no_std
# leaf crate, also depended on by the WASM report client.
rlevo-metrics-registry = { path = "../rlevo-metrics-registry", version = "0.4.0" }
# Population observer trait — only pulled in with the `record` feature
# so non-recording builds do not link burn through this crate.
rlevo-evolution = { path = "../rlevo-evolution", version = "0.4.0", optional = true, default-features = false }
# Built-in environments the `fixtures` module wires into preset suites and
# recording families. Optional and default-off: a consumer bringing their own
# environment must not compile rapier to run the harness. The edge points this
# way — harness depends on envs, never the reverse (ADR 0080).
rlevo-environments = { path = "../rlevo-environments", version = "0.4.0", optional = true, default-features = false }
rayon = "1"
rand = { workspace = true }
rand_distr = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry", "std"] }
bincode = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
toml = { version = "0.8", optional = true }
time = { version = "0.3", optional = true, features = ["formatting", "macros"] }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
approx = { workspace = true }
tempfile = "3"
# Unconditional (non-optional) so the in-source evaluator tests can install a
# capture layer and assert on the `tracing::warn!` the trial loop emits —
# logging behaviour no value assertion can observe. `rlevo-test-support`'s
# `FieldCapture` is the workspace helper for this, but it drags in `burn` and
# `rlevo-environments`, which this crate's test module deliberately avoids, and
# it collects one integer field so it cannot assert the `env` name.
# Same narrowed feature set as the optional `[dependencies]` entry above, so a
# test build adds no crate the `tui`/`record` builds do not already link.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# `rlevo-benchmarks-report-client` was a dev-dependency here for exactly one
# test -- `tests/wire_format_compat.rs`, which held the client's hand-written
# wire mirror in sync with this crate's schema. ADR 0081 deleted the mirror and
# the test with it: both sides now use `rlevo-scene`, so there is nothing to
# hold in sync. Do not re-add the edge to "test against the client" -- the
# shared definition is the guarantee, and a dev-dep here drags the whole Leptos
# tree into `cargo test -p rlevo-benchmarks` for no coverage.

[features]
default = ["json"]
json = ["dep:serde", "dep:serde_json"]
tui = ["dep:ratatui", "dep:crossterm", "dep:tracing-subscriber"]
record = ["dep:bincode", "dep:parking_lot", "dep:toml", "dep:time", "dep:serde", "dep:tracing-subscriber", "dep:rlevo-evolution"]
# Static-HTML report emitter: random-access loader + single-file inliner
# (Milestone 5). Builds on `record`; adds `base64` for payload inlining
# and `serde_json` for the manifest JSON payload.
report = ["record", "dep:base64", "dep:serde_json"]
# Preset `Suite` factories over the built-in environments, plus (with `record`)
# their `RecordedEnvFamily` impls. See `src/fixtures/mod.rs`.
fixtures = ["dep:rlevo-environments"]
# Passthroughs for the physics env families. A crate cannot `cfg` on another
# crate's feature, so the box2d / locomotion `RecordedEnvFamily` impls are gated
# on these rather than on `rlevo-environments/box2d` directly. The `rlevo`
# umbrella keeps each pair in lockstep; a direct consumer enables both halves.
fixtures-box2d = ["fixtures", "rlevo-environments/box2d"]
fixtures-locomotion = ["fixtures", "rlevo-environments/locomotion"]

# Render LaTeX in docs (e.g. the cartpole physics) via KaTeX on docs.rs.
# The header must live inside this crate's own directory — docs.rs builds
# from the packaged tarball, which cannot contain files outside the crate
# root, so a `../../` path here silently works locally but 404s on docs.rs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "katex-header.html"]

[[bin]]
name = "export-report"
path = "src/bin/export_report.rs"
required-features = ["report"]

[lints]
workspace = true
