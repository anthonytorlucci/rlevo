[package]
name = "rlevo-benchmarks-report-client"
version.workspace = true
authors.workspace = true
description = "Leptos/WASM client for the rlevo-harness static-HTML report"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Shared metric registry (ADR-0015): single source of truth for canonical
# metric names + RL/EO grouping. no_std, wasm-safe, no transitive burn/rand.
rlevo-metrics-registry = { path = "../rlevo-metrics-registry", version = "0.5.0" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { workspace = true }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
base64 = "0.23"
thiserror = { workspace = true }
# The client mirrors the rlevo-core::render::styled types and the harness's
# record schema in wire.rs rather than depending on either crate: the
# harness's `record` feature brings native-only dependencies, and the mirror
# keeps the WASM build to the registry alone. tests/wire_format_compat.rs
# guards drift.

# Selects getrandom's `wasm_js` backend on wasm32. Nothing else compiles
# getrandom for wasm32: leptos reaches it only through leptos_macro's uuid,
# a proc-macro dependency built for the host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlElement",
    "Window",
    # Hover-crosshair interaction: read the cursor offset and the rendered
    # SVG width to map pixels back to data coordinates.
    "MouseEvent",
    "DomRect",
    # Per-panel SVG export: build a download anchor and trigger it.
    "HtmlAnchorElement",
]

[dev-dependencies]
# The native unit tests in src/inline_data.rs decode the host emitter's
# `EpisodeMeta` JSON with it.
serde_json = "1"
# tests/wire_format_compat.rs: the native side of the wire-format mirror.
# The edge points from this crate to the harness, never back, so the
# harness's test build links no Leptos.
rlevo-core = { path = "../rlevo-core" }
rlevo-harness = { path = "../rlevo-harness", features = ["record"] }

[lints]
# The workspace lint set applies unchanged, pedantic clippy included; the
# crate has no blanket allows, only `#[allow]`s scoped to the items that
# need them.
workspace = true
