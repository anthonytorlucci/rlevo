[package]
name = "rlevo"
version.workspace = true
authors.workspace = true
description = "Deep Reinforcement Learning with Evolutionary Optimization"
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/rlevo"
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
# `burn` turns on `TensorConvertible`, which the prelude re-exports; named
# here rather than reached through the RL crate's request for it.
rlevo-core = { path = "../rlevo-core", version = "0.5.0", features = ["burn"] }
rlevo-environments = { path = "../rlevo-environments", version = "0.5.0", default-features = false }
rlevo-reinforcement-learning = { path = "../rlevo-reinforcement-learning", version = "0.5.0" }
rlevo-evolution = { path = "../rlevo-evolution", version = "0.5.0", default-features = false }
rlevo-hybrid = { path = "../rlevo-hybrid", version = "0.5.0" }
# The evaluation harness, re-exported as `rlevo::harness` (ADR 0084). At
# its default features it links no visualization crate.
rlevo-harness = { path = "../rlevo-harness", version = "0.5.0" }
# Re-exported as `rlevo::burn`, and the crate through which the `flex` and
# `wgpu` features below select a backend for the whole tree (ADR 0080).
burn = { workspace = true }

[dev-dependencies]
# Default features on, so the test targets that drive the physics
# environments build whatever features the umbrella itself is built with.
rlevo-environments = { path = "../rlevo-environments", version = "0.5.0" }
rlevo-test-support = { path = "../rlevo-test-support" }
approx = { workspace = true }
# Tests, benches and examples run on Flex whatever features the umbrella is
# built with.
burn = { workspace = true, features = ["default", "flex", "autodiff"] }
criterion = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
tempfile = "3"
# The harness examples install a subscriber so `LoggingReporter`'s `tracing`
# events reach the terminal.
tracing-subscriber = { workspace = true }

[features]
default = ["box2d", "locomotion", "flex"]
# Burn backends. The library crates name none; one of these, or a `burn`
# entry in the consumer's own manifest, selects it. Each also turns on
# `autodiff`, which the RL agents train through, and Burn's own defaults for
# the backend it selects.
# CPU backend (Burn's Flex).
flex = ["burn/default", "burn/flex", "burn/autodiff"]
# GPU backend (Burn's wgpu: Metal, Vulkan, DX12, WebGPU).
wgpu = ["burn/default", "burn/wgpu", "burn/autodiff"]
# Box2D-style physics environments (BipedalWalker, LunarLander, CarRacing)
box2d = ["rlevo-environments/box2d"]
# MuJoCo-inspired locomotion environments via Rapier3D
locomotion = ["rlevo-environments/locomotion"]
# Post-run product (ADR-0013): recording + static-HTML report. `report` pulls
# `record` transitively in rlevo-harness; `rlevo-environments/record` adds
# the per-family `RecordedEnvFamily` impls. No separate `viz-record` — the
# umbrella forwards products, not their parts (ADR-0013, Decision 5), and
# this is the one product since the live TUI was deleted (ADR 0096).
viz-report = ["rlevo-harness/report", "rlevo-environments/record"]

[lints]
workspace = true

