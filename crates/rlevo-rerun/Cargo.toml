[package]
name = "rlevo-rerun"
# Its own release line, not the workspace's: rerun guarantees a recording
# opens only across adjacent minor versions, so this crate releases when
# rerun moves a minor. The number is chosen at its first release.
version = "0.1.0"
authors.workspace = true
description = "Rerun recording sink for the rlevo evaluation harness"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["rerun", "reinforcement-learning", "evolution", "visualization"]
categories.workspace = true

[dependencies]
# `UPDATE_TARGET`, the tracing target the layer reads.
rlevo-core = { path = "../rlevo-core", version = "0.6.1" }
# The harness API this crate is written against (`SuiteInfo::run_id`,
# `Reporter::on_metrics`) is newer than the released 0.6.1, so this crate
# must not be published before the harness that has it. The workspace's
# version bump makes that harness 0.7.0, which this requirement does not
# admit, so the build fails until the line is raised.
rlevo-harness = { path = "../rlevo-harness", version = "0.6.1" }
# A caret within one minor, not an exact pin: patch fixes reach users, and a
# researcher's own `rerun` in the same minor resolves beside this one. `sdk`
# alone: no viewer, no server.
rerun = { version = "0.43.2", default-features = false, features = ["sdk"] }
# The trial map is shared between the sink and its tracing layer; the
# workspace's lock for sink state (ADR 0010).
parking_lot = { workspace = true }
tracing = { workspace = true }
# `UpdateLayer` is a `tracing_subscriber::Layer`; `registry` is what gives a
# layer the span an event was emitted in.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[dev-dependencies]
# Real PPO for the update layer's end-to-end test, on Flex.
burn = { workspace = true, features = ["default", "flex", "autodiff"] }
rlevo-reinforcement-learning = { path = "../rlevo-reinforcement-learning", version = "0.6.1" }
rand = { workspace = true }
# CartPole for the end-to-end run; no physics features.
rlevo-environments = { path = "../rlevo-environments", version = "0.6.1", default-features = false }
tempfile = "3"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
