name: crate-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: crate-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs/rules.md §4: tensor host-reads must propagate transfer errors —
  # `.unwrap_or_default()` substitutes an empty buffer for a real failure.
  # Line-local grep: catches the common single-line chain; multi-line chains
  # remain covered by review convention. rlevo-evolution is excluded until
  # the #136 sweep lands.
  tensor-read-hygiene:
    name: tensor-read hygiene grep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Forbid unwrap_or_default on tensor host-reads
        run: |
          hits=$(grep -rnE "(into_vec|into_data|to_vec)[^;]*unwrap_or_default" \
            crates/rlevo-core/src \
            crates/rlevo-environments/src \
            crates/rlevo-reinforcement-learning/src \
            crates/rlevo-hybrid/src \
            crates/rlevo/src || true)
          if [ -n "$hits" ]; then
            echo "::error::unwrap_or_default() on a tensor host-read (see docs/rules.md, Error Handling):"
            echo "$hits"
            exit 1
          fi

  # Issue #391: `[workspace.lints]` is inert on a member crate unless that
  # member opts in with `[lints] workspace = true`. Four crates silently
  # lacked it, so the workspace lint table was decorative on them and CI was
  # green because nothing was being checked — not because the code was clean.
  # Nothing in the toolchain reports this; a new crate reintroduces it by
  # simply not adding the stanza. This job is the only thing that notices.
  workspace-lints-optin:
    name: workspace lints opt-in
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every crate must opt into the workspace lint table
        run: |
          missing=""
          for manifest in crates/*/Cargo.toml; do
            # `workspace = true` must appear inside the `[lints]` table
            # specifically — a bare match would also accept it under
            # `[dependencies]`, `[package]`, or any other section.
            if ! awk '
              /^\[lints\]/    { in_lints = 1; next }
              /^\[/           { in_lints = 0 }
              in_lints && /^[[:space:]]*workspace[[:space:]]*=[[:space:]]*true/ { found = 1 }
              END             { exit !found }
            ' "$manifest"; then
              missing="$missing  $manifest\n"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::crate manifests missing '[lints] workspace = true' (see issue #391):"
            printf "$missing"
            echo "Without this stanza the workspace lint table does not apply to the crate."
            exit 1
          fi
          echo "all crate manifests opt into [workspace.lints]"

  # ── The tier, read from its single source of truth ───────────────────────────
  #
  # Issue #519: a hand-maintained matrix is one nothing in cargo checks. A crate
  # missing from it simply never has its tests run, and CI is green because
  # nothing was tested. That is how `rlevo`'s 22 test binaries, plus every test
  # in four other crates, stayed out of the pull-request gate.
  #
  # `FAST_CRATES` in `xtask/src/commands/test_fast.rs` is now the gate's crate
  # list, and `cargo xtask test-fast` asserts on every invocation that it is
  # total over `cargo metadata`'s workspace members — exact where the job this
  # replaced compared `basename crates/*/` against a grep of this file, and blind
  # to `xtask` itself, which is a member but not under `crates/`.
  #
  # Deriving the matrix here rather than restating it means the #519 drift cannot
  # occur at all: there is no second list to disagree with the first.
  tier:
    name: enumerate the fast tier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      crates: ${{ steps.enumerate.outputs.crates }}
      probes: ${{ steps.enumerate.outputs.probes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: crate-tests-tier

      # `--list` runs no tests; it asserts the tier is total and prints a JSON
      # array on stdout (xtask logs to stderr, so the capture stays clean).
      # The probe table is enumerated the same way and checked against
      # `xtask/probes/`, so a template no probe runs fails here.
      - name: Enumerate the tier
        id: enumerate
        run: |
          crates=$(cargo xtask test-fast --list)
          echo "fast tier: $crates"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          probes=$(cargo xtask probe --list)
          echo "probes: $probes"
          echo "probes=$probes" >> "$GITHUB_OUTPUT"

  # `[workspace.lints.rustdoc] broken_intra_doc_links = "deny"` sets the lint's
  # *level*, but nothing in the pull-request gate invoked rustdoc's link pass,
  # so the level applied to no run. `cargo test` is not a substitute: it builds
  # doctests via `rustdoc --test`, which compiles the ``` examples and never
  # resolves intra-doc links — a crate with a dangling `[`Foo::bar`]` tests
  # green. That is how a link naming a trait method as an inherent one sat in
  # `replay/config.rs` inside a 40-warning pile. Same silent-inertness class as
  # the #391 lint-opt-in and #519 test-matrix jobs above: the check existed on
  # paper and ran on nothing.
  #
  # Both feature configurations are checked. Default features miss every
  # `rlevo-harness` doc behind `tui` / `report` / `record` — 13 broken links
  # were hiding there — and `--all-features` alone would stop covering any doc
  # that a feature turns *off*.
  docs:
    name: rustdoc intra-doc links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: docs

      # `--no-deps`: only this workspace's docs are ours to keep link-clean.
      - name: Document with default features
        run: cargo doc --workspace --no-deps

      - name: Document with all features
        run: cargo doc --workspace --no-deps --all-features

  # ADR 0042 / issue #128: `box2d` and `locomotion` are orthogonal
  # rlevo-environments features (neither implies the other) — a shared type
  # gated behind only one of them silently breaks the other's build. Two
  # cheap steps in isolation catch that class of bug; the full
  # `cargo hack --feature-powerset` sweep is deliberately deferred (own issue).
  #
  # These run `clippy`, not `check`. `clippy` subsumes `check`, and linting
  # under each feature in isolation catches a failure mode that linting under
  # `--all-features` cannot: `clippy --fix` rewriting a closure into a trait
  # path resolved from an *optional* dependency. That happened on #398 —
  # `|v| v.is_finite()` in two `locomotion` modules became
  # `rapier2d::math::ComplexField::is_finite`, naming a crate gated behind
  # `box2d`. Under `--all-features` rapier2d is linked and it compiles; the
  # locomotion-only build is where it breaks.
  feature-orthogonality:
    name: rlevo-environments feature orthogonality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: feature-orthogonality

      - name: Lint box2d in isolation
        run: >
          cargo clippy -p rlevo-environments --all-targets
          --no-default-features --features box2d -- -D warnings

      - name: Lint locomotion in isolation
        run: >
          cargo clippy -p rlevo-environments --all-targets
          --no-default-features --features locomotion -- -D warnings

  # ADR 0080: no library crate selects a Burn backend. Every other job here
  # builds several workspace members at once, and cargo then unifies features
  # across them: a test target's `burn/flex` reaches the library under test, so
  # a library that names `burn::backend::Flex` compiles everywhere in CI and
  # nowhere for a consumer or on docs.rs, which build one crate with only the
  # features its own `[dependencies]` request. Building each library alone is
  # the only configuration that sees it.
  #
  # Three checks per crate. The resolved `burn` feature set is exactly `std`,
  # so the manifest selects nothing. `--lib` builds without dev-dependencies
  # (which do select a backend), so the code names nothing. The doc pass is the
  # same check for intra-doc links: a link to a backend type resolves in the
  # workspace build and is a hard error alone, where `broken_intra_doc_links`
  # is `deny`.
  #
  # The list is derived, not written down: every publishable member with a
  # normal dependency on `burn`, except the `rlevo` umbrella, which is the
  # leaf that selects the backend. A crate whose `burn` dependency is optional
  # (`rlevo-core`, ADR 0089) is checked twice: alone, where it must build and
  # document with no Burn at all, and with its `burn` feature on, where the
  # three checks apply as to any other library. A last step fails if
  # `rlevo-core` reaches any Burn package at its default features.
  libraries-select-no-backend:
    name: library crates select no Burn backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: libraries-select-no-backend

      - name: Check each library crate alone
        run: |
          set -euo pipefail
          # One line per crate: its name, and whether `burn` is optional.
          crates=$(cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[]
            | select(.publish == null and .name != "rlevo")
            | .name as $name
            | [.dependencies[] | select(.name == "burn" and .kind == null)]
            | select(length > 0)
            | "\($name) \(.[0].optional)"')
          if [ -z "$crates" ]; then
            echo "::error::no publishable crate depends on burn; this job checks nothing"
            exit 1
          fi
          while read -r crate optional; do
            flags=""
            if [ "$optional" = "true" ]; then
              # Alone, with no Burn: the configuration a consumer gets by default.
              cargo check -p "$crate" --lib
              cargo doc -p "$crate" --no-deps
              flags="--features burn"
            fi
            features=$(cargo tree -p "$crate" $flags -e normal -f '{p} [{f}]' --prefix none \
              | grep '^burn v' | sed -E 's/^burn v[^ ]+ \[(.*)\].*/\1/' | sort -u)
            expected="std"
            # The RL crate trains, and Burn 0.22 puts its optimizers behind
            # `optim`, which brings `autodiff`. Neither selects a backend
            # (ADR 0093).
            if [ "$crate" = "rlevo-reinforcement-learning" ]; then
              expected="autodiff,burn-optim,optim,std"
            fi
            if [ "$features" != "$expected" ]; then
              echo "::error::$crate resolves burn with features [$features]; expected [$expected] (ADRs 0080, 0093)"
              exit 1
            fi
            cargo check -p "$crate" --lib $flags
            cargo doc -p "$crate" --no-deps $flags
          done <<< "$crates"

      - name: No default device
        # A test build that compiles wgpu turns `Device::default()` into a
        # wgpu device, which aborts on this GPU-less runner (ADR 0093).
        run: tools/no-default-device.sh

      - name: rlevo-core depends on no Burn by default
        run: |
          set -euo pipefail
          # Two lines, not one pipeline: `|| true` must forgive only grep's
          # no-match exit. Inside one pipeline it would also forgive a failed
          # `cargo tree`, whose empty output counts as zero and passes.
          tree=$(cargo tree -p rlevo-core -e normal -f '{p}' --prefix none)
          count=$(printf '%s\n' "$tree" | grep -c '^burn' || true)
          if [ "$count" != "0" ]; then
            echo "::error::rlevo-core reaches $count burn packages at its default features; it depends on Burn only under its burn feature (ADR 0089)"
            cargo tree -p rlevo-core -e normal -i burn
            exit 1
          fi

  # ── Per-crate default test sets ─────────────────────────────────────────────
  #
  # `cargo xtask test-fast <crate>` expands to `cargo test -p <crate>` plus the
  # features that crate's test targets need. Those overrides live in the tier
  # table, not here: a bare `cargo test -p <crate>` *skips* a target whose
  # `required-features` are unmet and compiles a `#![cfg(feature = ...)]` file to
  # nothing — both silently, with a zero exit code. `rlevo` needs `viz-report`
  # and `rlevo-harness` needs `record` for exactly that reason.
  #
  # The heavy `#[ignore]`d tests are not run here; they are `weekly-tests.yml`'s
  # `cargo xtask test-heavy` tier.
  test:
    name: ${{ matrix.crate }}
    needs: tier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.tier.outputs.crates) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: crate-tests-${{ matrix.crate }}

      - name: Test ${{ matrix.crate }}
        run: cargo xtask test-fast ${{ matrix.crate }}

  # ── Outside-in probes ────────────────────────────────────────────────────────
  #
  # Every job above builds inside the workspace: siblings resolve by path,
  # `publish = false` crates are reachable as dev-dependencies, and
  # `required-features` are satisfied for the test. None of that holds for a
  # consumer. A probe packages the workspace, extracts the crates and builds a
  # small crate against them from a directory outside the checkout, so a file
  # missing from a package or an item that is not public fails here, before a
  # release, and nowhere else. It is also the only job that compiles the
  # packaged crates against each other.
  #
  # The matrix comes from `PROBES` in `xtask/src/commands/probe/mod.rs`. A walk
  # is red when a fatal step fails, and its summary names the step. A
  # measurement is red only when its crate does not resolve or build; its
  # numbers go to the summary and gate nothing.
  probe:
    name: probe (${{ matrix.probe }})
    needs: tier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        probe: ${{ fromJSON(needs.tier.outputs.probes) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Caches `xtask`'s own build. A probe builds in its run directory,
      # outside the checkout, and that build is cold on purpose.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: crate-tests-probe

      - name: Probe ${{ matrix.probe }}
        run: cargo xtask probe ${{ matrix.probe }}
