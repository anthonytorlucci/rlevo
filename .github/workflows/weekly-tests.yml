name: weekly-tests

on:
  schedule:
    # 02:00 UTC every Sunday
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Only one weekly run at a time; a new schedule trigger cancels a stale one.
concurrency:
  group: weekly-tests
  cancel-in-progress: true

jobs:
  # ── Per-algorithm regression suites ─────────────────────────────────────────
  #
  # The heavy RL convergence / reproducibility tests all carry `#[ignore]`, so
  # the fast `test-workspace` suite skips them. This job runs every ignored test
  # in an algorithm's integration binary in one shot:
  #
  #     cargo test --release --test <binary> -- --ignored
  #
  # One matrix job per algorithm keeps failures isolated and individually
  # re-runnable. Invoking the binary (not individual test names) is deliberate:
  # the heavy tests are macro-generated (`rl_learning_test!` /
  # `rl_reproducibility_test!`) and were renamed once already — enumerating names
  # here is exactly what drifts — which is also why this file no longer names a
  # test at all: `xtask/test/run.sh` supplies `--release`, the feature
  # overrides, and the `--skip` for QR-DQN's hours-long
  # `qrdqn_cartpole_acceptance`, which runs in the separate `acceptance` job
  # below. The two jobs here map one-to-one onto the `heavy` and `acceptance`
  # tiers, so a local run and this workflow cannot disagree about scope.
  regression:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "DQN — heavy suite (CartPole converge + reproducibility)"
            bin: dqn_integration
          - name: "C51 — heavy suite (CartPole converge + reproducibility)"
            bin: c51_integration
          # The acceptance run is excluded by the `heavy` tier itself, not by a
          # `skip:` key here — see `acceptance_units` in xtask/test/run.sh.
          - name: "QR-DQN — heavy suite (excludes acceptance)"
            bin: qrdqn_integration
          - name: "PPO — heavy suite (CartPole converge + Pendulum + reproducibility)"
            bin: ppo_integration
          - name: "PPG — heavy suite (aux phases, CartPole + reproducibility)"
            bin: ppg_integration
          - name: "DDPG — heavy suite (LinearEnv + Pendulum)"
            bin: ddpg_integration
          - name: "TD3 — heavy suite (LinearEnv + Pendulum 500k)"
            bin: td3_integration
          - name: "SAC — heavy suite (LinearEnv + Pendulum)"
            bin: sac_integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Separate cache key per matrix job so jobs don't thrash each other.
          key: weekly-${{ matrix.bin }}

      # `heavy` supplies `--release`, `-- --ignored`, any per-binary feature
      # override, and the `--skip` for every acceptance test in this binary —
      # the acceptance job below runs those instead. Nothing here names a test.
      - name: Run ${{ matrix.name }}
        run: ./xtask/test/run.sh heavy ${{ matrix.bin }}

  # ── Full acceptance tests (~hours) ──────────────────────────────────────────
  #
  # Hours-long full-solve runs that won't fit the regression job's timeout. Run
  # every week alongside the regression suite, and on-demand via
  # workflow_dispatch. Promote a test into the regression job when its runtime
  # becomes acceptable as hardware improves.
  acceptance:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # `acceptance <bin>` selects every acceptance test in that binary;
          # the test name lives in `acceptance_units`, not in this file.
          - name: "QR-DQN — CartPole acceptance (500k steps, reward ≥ 195)"
            bin: qrdqn_integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: weekly-${{ matrix.bin }}

      - name: Run ${{ matrix.name }}
        run: ./xtask/test/run.sh acceptance ${{ matrix.bin }}
