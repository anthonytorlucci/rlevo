# Regression net for the visualisation/recording/reporting examples.
#
# These examples live in `crates/rlevo-examples/` (ADR 0012), a crate outside
# `default-members`, and most are `required-features`-gated, so a plain
# `cargo build` / `cargo test` never compiles them — that is how ~10 examples
# once shipped non-compiling (the `std` vs `parking_lot` Mutex split, ADR 0010)
# without anyone noticing.
#
# This job compiles every example in `rlevo-examples` with the full feature
# set. It is build-only: actually running them needs `--release` wall-clock
# (PPO/EA) and a `trunk`-built WASM bundle (`*_with_client`).
# Compiling is enough to catch producer-API drift like the Mutex split.
name: viz-examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: viz-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-examples:
    name: build + clippy (viz examples, all features)
    runs-on: ubuntu-latest
    # The slowest of 194 runs (2026-07-19 to 2026-10-18) took 5.8 minutes.
    # This is a required check: without a bound, a hung runner holds a pull
    # request for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The toolchain (channel + rustfmt/clippy components) is governed by
      # rust-toolchain.toml at the repo root; rustup auto-installs the pin on
      # the first cargo invocation.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # The examples pull rapier2d (box2d), rapier3d (locomotion), and
      # burn-wgpu. None need a GPU to *compile*; libudev is the only
      # build-time system dep on a headless runner.
      #
      # The step took 84 seconds at most over the same runs and once hung
      # for more than 40 minutes. A stalled mirror is retried, and the step
      # fails in minutes rather than waiting out the job's bound.
      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            install -y --no-install-recommends libudev-dev

      - name: Install just
        uses: taiki-e/install-action@2b818c67b359d9778206f1396bde7f4381ebfeda # just

      - name: Build viz examples (full feature set)
        run: just build-vis-examples

      - name: Clippy viz examples (full feature set)
        run: just clippy-vis-examples
